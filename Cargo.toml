[workspace]
resolver = "2"
members = ["crates/core", "crates/relay", "crates/client", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/canyorg/ghostline"
authors = ["Murat Can Yorgancıoğlu"]

[workspace.dependencies]
rand = "0.8"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Argon2 is unbearably slow unoptimised; keep tests/dev builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
