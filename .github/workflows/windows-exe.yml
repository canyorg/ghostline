name: Windows exe (latest main)

# Builds the Windows binaries on every push to main and keeps them as a downloadable
# workflow artifact (Actions → this run → Artifacts), without needing a release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ghostline-gui -p ghostline -p ghostline-relay
      - uses: actions/upload-artifact@v4
        with:
          name: ghostline-windows-${{ github.sha }}
          path: |
            target/release/ghostline-gui.exe
            target/release/ghostline.exe
            target/release/ghostline-relay.exe
          retention-days: 30
