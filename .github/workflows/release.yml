name: Release

# Push a tag like v0.2.0 to build Linux + Windows binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/ghostline${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/ghostline-relay${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/ghostline-gui${{ matrix.ext }} dist/
          cd dist
          for f in ghostline${{ matrix.ext }} ghostline-relay${{ matrix.ext }} ghostline-gui${{ matrix.ext }}; do
            mv "$f" "${f%.exe}-${{ matrix.target }}${{ matrix.ext }}"
          done
          sha256sum * > SHA256SUMS-${{ matrix.target }}.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
